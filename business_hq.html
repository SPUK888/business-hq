<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0c1530; --bg2: #04070f; --ink: #e8eefc; --dim: #8a97b8; --line: rgba(160, 180, 230, .16);
    --card: rgba(12, 19, 40, .84); --accent: #7dd3fc;
    --head: 'Space Grotesk', system-ui, sans-serif; --body: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(ellipse at 50% 45%, var(--bg1), var(--bg2) 72%); color: var(--ink);
         font: 14px/1.45 var(--body); overflow: hidden; }
  [hidden] { display: none !important; }
  #stage { position: fixed; inset: 0; cursor: grab; }
  #stage.drag { cursor: grabbing; }
  .ui { position: fixed; z-index: 5; }
  #brand { top: 18px; left: 24px; }
  #brand h1 { font: 700 26px/1 var(--head); margin: 0; letter-spacing: .5px; }
  #brand h1 span { color: var(--accent); }
  #brand p { margin: 6px 0 0; color: var(--dim); font-size: 13px; }
  #brand p b { color: var(--ink); font-weight: 600; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; max-width: 520px; }
  #chips span { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: #c3cde6; }
  #chips b { color: var(--ink); font: 700 13px var(--head); margin-right: 3px; }
  #meta { top: 18px; right: 24px; display: flex; gap: 8px; align-items: center; }
  #clock { font: 500 13px var(--head); color: var(--dim); margin-right: 4px; }
  .btn { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 999px;
         padding: 7px 14px; font: 600 12px var(--body); cursor: pointer; backdrop-filter: blur(8px); }
  .btn:hover { border-color: rgba(125, 211, 252, .5); }
  .btn[aria-pressed="true"] { background: #7dd3fc; color: #04111f; border-color: #7dd3fc; }

  #panel { top: 68px; right: 24px; width: 340px; max-height: calc(100vh - 92px); overflow: auto;
           background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 14px;
           backdrop-filter: blur(14px); }
  #panel .kicker { font: 600 11px var(--body); letter-spacing: 1.6px; text-transform: uppercase; color: var(--dim); }
  #panel h2 { font: 700 21px/1.15 var(--head); margin: 4px 0 8px; }
  #panel .blurb { color: #c3cde6; margin: 0 0 12px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat { background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; }
  .stat b { display: block; font: 700 20px/1.15 var(--head); }
  .stat span { color: var(--dim); font-size: 12px; }
  .list { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .list li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .list li span:last-child { color: var(--dim); white-space: nowrap; }
  .steps { margin: 0 0 12px; padding-left: 18px; color: #c3cde6; }
  .steps li { margin: 4px 0; }
  .back { margin-top: 12px; }
  .podlink { display: inline-block; margin: 0 6px 14px 0; text-decoration: none; background: var(--c); color: #0b0f1a; border-color: var(--c); font-size: 13px; padding: 9px 16px; }
  .podlink:hover { filter: brightness(1.08); }
  .podlink:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .note { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .desks { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 14px; }
  .desks span { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: #c3cde6; }

  #feed { left: 24px; bottom: 20px; width: 300px; background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; padding: 10px 12px 6px; backdrop-filter: blur(12px); }
  #feed .kicker { font: 600 10.5px var(--body); letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
  #feed ul { list-style: none; margin: 0; padding: 0; }
  #feed li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 12.5px; animation: in .5s ease; }
  #feed li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #feed li i { width: 7px; height: 7px; border-radius: 50%; flex: none; transform: translateY(-1px); }
  #feed li em { font-style: normal; color: var(--dim); margin-left: auto; white-space: nowrap; font-size: 11.5px; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card { position: fixed; z-index: 3; width: 176px; cursor: pointer;
          background: var(--card); border: 1px solid var(--line); border-top: 2px solid var(--c); border-radius: 12px;
          padding: 8px 10px 7px; backdrop-filter: blur(10px); transition: opacity .3s, border-color .3s;
          box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
  .card:hover { border-color: var(--c); }
  .card .h { display: flex; align-items: center; gap: 6px; font: 600 10px var(--body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--c); }
  .card .h i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
  .card .h em { margin-left: auto; font-style: normal; color: var(--dim); letter-spacing: .5px; }
  .card .big { font: 700 24px/1 var(--head); margin: 5px 0 1px; }
  .card .big small { font: 500 11px var(--body); color: var(--dim); margin-left: 5px; }
  .card .rows { margin-top: 5px; border-top: 1px solid var(--line); padding-top: 4px; }
  .card .rows div { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--dim); padding: 1px 0; }
  .card .rows b { color: var(--ink); font-weight: 600; white-space: nowrap; }
  .card .foot { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: #b7c3e0; margin-top: 5px; padding-top: 4px; border-top: 1px solid var(--line); }
  .card .foot i { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; flex: none; animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .card .badge { margin-top: 6px; font: 600 10.5px var(--body); color: #1a1204; background: #fbbf24; border-radius: 999px;
                 padding: 3px 9px; display: inline-block; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(251, 191, 36, 0); opacity: .75; } 0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, .55); } }
  .card.dim { display: none; }   
  
  body.compact .card .rows, body.compact .card .foot { display: none; }
  body.compact .card { width: 150px; }
  .engine { position: fixed; z-index: 2; transform: translate(-50%, -100%); pointer-events: none; text-align: center; transition: opacity .3s; }
  .engine .n { font: 600 11px var(--body); letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); padding: 3px 10px;
               border-radius: 999px; background: rgba(4, 8, 18, .72); border: 1px solid var(--line); }
  .engine .s { font-size: 11.5px; color: #b7c3e0; margin-top: 4px; text-shadow: 0 1px 8px rgba(0, 0, 0, .9); }
  .tag { position: fixed; z-index: 1; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap;
         font: 600 8.5px var(--body); letter-spacing: .8px; text-transform: uppercase; color: #dbe4fa;
         background: rgba(4, 8, 18, .72); border: 1px solid rgba(160, 180, 230, .14); border-left: 2px solid var(--c);
         padding: 2px 5px; border-radius: 4px; transition: opacity .25s; }
  #hint { left: 50%; bottom: 20px; transform: translateX(-50%); color: var(--dim); font-size: 12px; }
  
  #tourcap { left: 50%; bottom: 26px; transform: translateX(-50%); width: min(780px, calc(100vw - 32px)); cursor: pointer;
             background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 22px 16px;
             font: 500 21px/1.35 var(--head); text-align: center; backdrop-filter: blur(14px); box-shadow: 0 16px 40px rgba(0, 0, 0, .45); }
  #tourcap small { display: block; font: 600 11px var(--body); letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  #tourcap .keys { display: block; margin-top: 8px; font: 500 11px var(--body); color: var(--dim); }
  body.present #hint, body.present #howbtn, body.present #showroom, body.present #clock, body.present #feed, body.present #homebtn { display: none; }
  body.present #panel { width: 400px; font-size: 15.5px; max-height: calc(100vh - 250px); }  
  body.present #panel h2 { font-size: 28px; }
  body.present .card .big { font-size: 30px; }
  .pkgs { margin: 0 0 14px; }
  .pkgs-h { font: 600 11px var(--body); letter-spacing: 1.4px; text-transform: uppercase; color: var(--dim); margin-bottom: 7px; }
  .pkgs-g { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pkg { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 1px solid var(--line); border-left: 3px solid var(--c);
         border-radius: 9px; background: rgba(255, 255, 255, .03); color: var(--ink); text-decoration: none; }
  .pkg b, .pkg .pkg-name { font: 600 12.5px/1.25 var(--body); color: var(--ink); text-decoration: none; }
  .pkg .pkg-name::after { content: ' 97'; color: var(--c); }
  .pkg .pkg-name:hover { color: var(--c); }
  .pkg .pkg-office { color: var(--dim); }
  .pkg .pkg-office:hover { color: var(--ink); }
  .pkg span { font-size: 11px; color: var(--dim); }
  a.pkg:hover { background: rgba(255, 255, 255, .08); border-color: var(--c); }
  a.pkg:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
  body.present .pkg b { font-size: 14px; }
  .list li a.rowlink { display: flex; justify-content: space-between; gap: 10px; width: 100%; color: inherit; text-decoration: none; }
  .list li a.rowlink:hover span:first-child, .list li a.rowlink:focus-visible span:first-child { color: var(--accent); }
  .list li a.rowlink:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #empty { inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; }
  @media (max-width: 1300px) { #hint { display: none; } #feed li:nth-child(n+4) { display: none; } }
  
  @media (max-width: 640px) {
    #panel { top: auto; bottom: 16px; right: 16px; left: 16px; width: auto; max-height: 40vh; padding: 14px; }
    #panel .blurb, #panel .desks { display: none; }
    #panel h2 { font-size: 18px; }
    #feed, #clock, #brand p, #chips { display: none; }
    #brand { left: 16px; } #meta { right: 16px; }
    #brand h1 { font-size: 22px; }
    #howbtn { display: none; }
    .card { width: auto; padding: 4px 8px 5px; }
    .card .rows, .card .h em, .card .foot { display: none; }
    .card .h { font-size: 9px; }
    .card .big { font-size: 17px; margin: 2px 0 0; }
    .card .big small { display: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="brand" class="ui">
  <h1>Business <span>HQ</span></h1>
  <p><b id="desks">44 desks</b> · MyElliot on reception</p>
  <div id="chips"></div>
</div>
<div id="meta" class="ui">
  <span id="clock"></span>
  <button class="btn" id="presentbtn" aria-pressed="false" title="Full-screen walk-through: arrow keys to move, Esc to stop">Present</button>
  <button class="btn" id="howbtn" aria-pressed="false">How it works</button>
  <button class="btn" id="showroom" hidden></button>
</div>
<aside id="panel" class="ui" hidden></aside>
<div id="tourcap" class="ui" hidden></div>
<div id="feed" class="ui"><div class="kicker">Real activity · replayed</div><ul id="feedlist"></ul></div>
<div id="hint" class="ui">drag to turn · scroll to zoom · click a pod</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.BUSINESS_DATA = {
  /* YOUR NUMBERS GO HERE - everything below is sample data. Replace each value with your own. */
  
  "name": "Your Business",
  "tz": "Australia/Perth", "tzLabel": "Perth",
  "generated": "2026-09-19T00:00:00Z",
  "sample": true,
  "totals": {
    "visits": 1200, "local": 310, "enquiries": 42, "whatsapp": 18, "calls": 57, "calls_missed": 9,
    "quotes": 31, "won": 19, "booked": 6, "pages": 40, "pages_indexed": 36,
    "local_searches": 240, "shown": 5200, "clicks": 180, "best_pos": 4,
    "reviews": 27, "rating": 5.0, "new_reviews": 3,
    "customers": 140, "followups": 7,
    "emails_in": 64, "emails_answered": 61, "auto_sorted": 0,
    "ad_spend": 0, "ad_leads": 0
  },
  "sites": [{"dom": "website", "brand": "Your website", "trade": "other"}],
  "enquiries": [["Quote quiz", 21], ["WhatsApp", 18], ["Phone", 57], ["Email", 12]],
  "jobs": [["Quotes sent", 31], ["Jobs won", 19], ["Booked this week", 6], ["Win rate", "61%"]],
  "events": [
    {"t": "2026-09-19T01:10:00Z", "dom": "website", "kind": "visit", "src": "google-organic"},
    {"t": "2026-09-19T01:40:00Z", "dom": "website", "kind": "whatsapp", "src": "direct"},
    {"t": "2026-09-19T02:05:00Z", "dom": "website", "kind": "call", "src": "direct"},
    {"t": "2026-09-19T02:30:00Z", "dom": "website", "kind": "visit", "src": "direct"},
    {"t": "2026-09-19T03:00:00Z", "dom": "website", "kind": "visit", "src": "google-organic"},
    {"t": "2026-09-19T03:20:00Z", "dom": "website", "kind": "whatsapp", "src": "google-organic"}
  ]
};</script>
<script>
(() => {
  const D = window.BUSINESS_DATA;
  if (!D || !window.THREE) {
    const e = document.createElement('div'); e.id = 'empty'; e.className = 'ui';
    e.innerHTML = '<div><h2>No data yet</h2><p>The data block at the top of this file is missing.</p></div>';
    document.body.appendChild(e); return;
  }

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TRADE = { other: 'Trade' };
  let showroom = false;
  const masked = {};
  { const n = {}; for (const s of D.sites) { n[s.trade] = (n[s.trade] || 0) + 1; masked[s.dom] = `${TRADE[s.trade] || 'Trade'} · site ${String.fromCharCode(64 + n[s.trade])}`; } }
  const nameOf = s => showroom ? masked[s.dom] : s.brand;
  const nameDom = d => { const s = D.sites.find(x => x.dom === d); return s ? nameOf(s) : (showroom ? 'a site' : d); };
  const termOf = s => showroom ? (TRADE[s.trade] || 'trade') + ' search' : s.term;
  const T = D.totals;
  D.checkpoint = D.checkpoint || D.generated;
  if (D.name) { document.title = D.name + ' HQ'; document.querySelector('#brand h1').innerHTML = `${esc(D.name)} <span>HQ</span>`; }
  if (D.home) { const a = document.createElement('a'); a.className = 'btn'; a.id = 'homebtn'; a.href = D.home; a.style.textDecoration = 'none';
                a.innerHTML = '&larr; Back'; document.getElementById('meta').prepend(a); }
  const days = Math.max(0, Math.ceil((Date.parse(D.checkpoint) - Date.now()) / 864e5));
  const ago = t => { const m = Math.max(0, (Date.now() - Date.parse(t)) / 6e4); return m < 60 ? Math.round(m) + 'm ago' : m < 2880 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
  const SRC = { 'google-organic': 'Google', 'bing-organic': 'Bing', facebook: 'Facebook' };
  const srcName = s => SRC[s] || (showroom ? 'another site' : s);
  const topSrc = () => (T.sources && T.sources.length) ? `${srcName(T.sources[0][0])} ${T.sources[0][1]}` : 'from today';
  const count = f => D.sites.filter(f).length;

  const PODS = [
    { id: 'reception', name: 'MyElliot', color: '#f59e0b',
      big: () => T.calls, bigLabel: 'calls',
      rows: () => [['answered for you', T.calls - T.calls_missed], ['missed', T.calls_missed], ['answered 24/7', 'with MyElliot']],
      roles: ['MyElliot', 'Call Router', 'Booking Clerk', 'Text-back Bot', 'Voicemail Catcher', 'Callback Timer'],
      title: 'MyElliot · Reception', foot: 'every call answered, day or night',
      links: [{ href: 'https://myelliot.uk/', text: 'See MyElliot in action' }],
      blurb: 'An AI receptionist that answers every call, day or night, takes the job details, books it in and texts you the summary. No more missed calls while you are on a job.',
      list: () => [['Calls this month', T.calls], ['Missed', T.calls_missed], ['Would be caught by MyElliot', T.calls_missed]] },
    { id: 'leads', name: 'Enquiries', color: '#22c55e',
      big: () => T.enquiries, bigLabel: 'enquiries',
      rows: () => [['from WhatsApp', T.whatsapp], ['local visitors', T.local], ['top source', topSrc()]],
      roles: ['Quote Quiz', 'WhatsApp Catcher', 'Visitor Counter', 'Source Tracker', 'Reply Timer', 'Spam Filter'],
      title: 'Enquiries', foot: 'every enquiry in one place',
      links: [{ href: 'https://web.whatsapp.com/', text: 'Open WhatsApp' }],
      blurb: 'Catches every enquiry from the website, the quote quiz, WhatsApp and the phone, and shows where each one came from.',
      list: () => (D.enquiries || []).map(([a, b]) => [a, b]) },
    { id: 'sites', name: 'Website', color: '#3b82f6',
      big: () => T.pages, bigLabel: 'pages',
      rows: () => [['pages in Google', T.pages_indexed], ['visits', T.visits], ['local visitors', T.local]],
      roles: ['Page Builder', 'Health Check', 'Speed Check', 'Security Guard', 'Image Checker', 'Copy Checker'],
      title: 'Website', foot: 'checked every night',
      blurb: 'Keeps the website fast, working and complete, and checks every page Google can see.',
      list: () => [['Pages', T.pages], ['Pages in Google', T.pages_indexed], ['Visits (month)', T.visits], ['Local visitors', T.local]] },
    { id: 'rankings', name: 'SEO desk', color: '#a78bfa',
      big: () => T.local_searches, bigLabel: 'local searches',
      rows: () => [['shown in Google', T.shown], ['clicks from Google', T.clicks], ['best position', '#' + T.best_pos]],
      roles: ['Search Watcher', 'Position Checker', 'Index Watcher', 'Competitor Spy', 'Keyword Finder'],
      title: 'SEO desk', foot: 'what local people search for',
      links: [{ href: 'https://search.google.com/search-console', text: 'Open Google Search Console' }],
      blurb: 'Shows what people near you type into Google, how often your site appears, and where it ranks.',
      list: () => [['Local searches (28 days)', T.local_searches], ['Times shown in Google', T.shown], ['Clicks', T.clicks], ['Best position', '#' + T.best_pos]] },
    { id: 'studio', name: 'Reviews', color: '#f472b6',
      big: () => T.reviews, bigLabel: 'Google reviews',
      rows: () => [['rating', T.rating.toFixed(1) + ' / 5'], ['new this month', T.new_reviews], ['asked after every job', 'yes']],
      roles: ['Review Asker', 'Reply Writer', 'Rating Watcher', 'Photo Collector'],
      title: 'Reviews', foot: 'a review asked for after every job',
      links: [{ href: 'https://business.google.com/', text: 'Open Google Business Profile' }],
      blurb: 'Asks every happy customer for a review, replies to each one, and keeps the rating visible where people decide.',
      list: () => [['Google reviews', T.reviews], ['Rating', T.rating.toFixed(1) + ' / 5'], ['New this month', T.new_reviews]] },
    { id: 'jobs', name: 'Jobs', color: '#2dd4bf',
      big: () => T.won, bigLabel: 'jobs won',
      rows: () => [['quotes sent', T.quotes], ['booked this week', T.booked], ['win rate', Math.round(100 * T.won / Math.max(1, T.quotes)) + '%']],
      roles: ['Quote Writer', 'Booking Diary', 'Job Tracker', 'Invoice Chaser', 'Follow-up Timer'],
      title: 'Jobs', foot: 'from enquiry to booked job',
      blurb: 'Tracks every quote from sent to won, and every job from booked to paid.',
      list: () => (D.jobs || []).map(([a, b]) => [a, b]) },
    { id: 'crm', name: 'Customers', color: '#ef4444',
      big: () => T.customers, bigLabel: 'customers',
      rows: () => [['follow-ups due', T.followups], ['repeat customers', 'tracked'], ['service reminders', 'ready']],
      roles: ['Customer Book', 'Follow-up Chaser', 'Reminder Bot', 'Job Notes', 'Contact Book'],
      title: 'Customers', foot: 'every customer in one place',
      blurb: 'Keeps every customer, every job and every follow-up in one place, so repeat work and referrals are never missed.',
      list: () => [['Customers', T.customers], ['Follow-ups due', T.followups]] },
    { id: 'email', name: 'Email desk', color: '#cbd5e1',
      big: () => T.emails_in, bigLabel: 'emails in',
      rows: () => [['answered', T.emails_answered], ['sorted automatically', T.auto_sorted || 'ready to connect'], ['spam removed', 'yes']],
      roles: ['Inbox Sorter', 'Reply Drafter', 'Follow-up Bot', 'Spam Filter'],
      title: 'Email desk', foot: 'every email sorted and answered',
      blurb: 'Reads every enquiry email, sorts it (quote, booking, question or spam) and drafts a reply for you to send.',
      list: () => [['Emails in', T.emails_in], ['Answered', T.emails_answered], ['Sorted automatically', T.auto_sorted || 'ready to connect']] },
    { id: 'ads', name: 'Ads desk', color: '#fb923c',
      big: () => T.ad_leads, bigLabel: 'leads from ads',
      rows: () => [['spend', '$' + T.ad_spend], ['cost per lead', T.ad_leads ? '$' + Math.round(T.ad_spend / T.ad_leads) : '-'], ['tracking', 'every lead']],
      roles: ['Campaign Planner', 'Budget Guard', 'Ad Writer', 'Click Checker'],
      title: 'Ads desk', foot: 'every ad lead traced to its keyword',
      links: [{ href: 'https://ads.google.com/', text: 'Open Google Ads' }],
      blurb: 'Runs ads when you want more work, and traces every lead back to the keyword that paid for it.',

    }
    const b = brandRect;
    if (b && x < b.right + 8 && x + cw > b.left && y < b.bottom + 8) y = b.bottom + 8;
    p.card.style.transform = 'none';
    p.card.style.left = x + 'px'; p.card.style.top = y + 'px';
  }
  const feedEl = document.getElementById('feed'), brandEl = document.getElementById('brand');
  let feedRect = null, brandRect = null;

  const setPressed = (btn, on) => btn.setAttribute('aria-pressed', String(on));
  document.getElementById('showroom').onclick = e => {
    showroom = !showroom; setPressed(e.currentTarget, showroom);
    renderCards(); renderPanel(); feedEls.forEach(x => x.refresh());
  };

  const KIND = { visit: ['Local visitor', '#3b82f6', 2], whatsapp: ['WhatsApp tap', '#22c55e', 1], call: ['Call tap', '#f59e0b', 0] };
  const events = D.events.slice().sort((a, b) => a.t < b.t ? -1 : 1);
  const waiting = events.filter(e => e.kind === 'whatsapp' && Date.now() - Date.parse(e.t) < 48 * 3600e3).length;
  const feedlist = document.getElementById('feedlist');
  const feedEls = [];
  let ei = Math.max(0, events.length - 6);
  function nextEvent() {
    if (!events.length) return;
    const ev = events[ei % events.length]; ei++;
    const k = KIND[ev.kind] || KIND.visit;
    const li = document.createElement('li');
    const item = { li, refresh() {
      const from = ev.src && ev.src !== 'direct' ? ' from ' + srcName(ev.src) : '';
      li.innerHTML = `<i style="background:${k[1]}"></i><span>${esc(k[0])} · ${esc(nameDom(ev.dom))}${esc(from)}</span><em>${esc(ago(ev.t))}</em>`;
    } };
    item.refresh(); feedlist.prepend(li); feedEls.unshift(item);
    while (feedEls.length > 5) feedEls.pop().li.remove();
    pulse(k[2]);
    if (ev.kind === 'whatsapp') { pods[1].badgeText = 'New WhatsApp lead · waiting for a reply'; pods[1].badgeUntil = performance.now() + 7000; renderCards(); }
    if (ev.kind === 'call') { pods[0].badgeText = 'Missed call · MyElliot would answer'; pods[0].badgeUntil = performance.now() + 7000; renderCards(); }
  }

  renderCards(); renderPanel();
  const clock = new THREE.Clock();
  let sinceEvent = 0, sinceBadge = 0;
  const lift = new THREE.Vector3();
  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, ease = 1 - Math.pow(0.002, dt);
    target.lerp(targetGoal, ease); zoom += (zoomGoal - zoom) * ease;
    frame();
    const showTags = stage.clientWidth > 640 && pxPerUnit > 19;
    { const r = feedEl.getBoundingClientRect(); feedRect = r.width ? r : null; }
    brandRect = brandEl.getBoundingClientRect();
    pods.forEach((p, i) => {
      p.g.position.y = Math.sin(t * 0.7 + i * 1.1) * 0.05;
      p.flash *= Math.pow(0.12, dt);
      p.topMat.emissiveIntensity = 0.1 + p.flash * 0.8;
      p.edgeMat.opacity = 0.45 + p.flash * 0.55;
      for (const w of p.workers) {
        const u = w.userData;
        u.head.position.y = u.headY + Math.sin(t * 1.6 + u.phase) * 0.012;
        u.arms[0].rotation.x = Math.sin(t * 13 + u.phase) * 0.12;
        u.arms[1].rotation.x = Math.sin(t * 13 + u.phase + 1.7) * 0.12;
        u.scrMat.color.copy(u.base).multiplyScalar(0.75 + 0.25 * Math.sin(t * 2.3 + u.phase));
      }
      placeCard(p);
    });
    for (const tg of tags) {
      const on = showTags && (focus < 0 || focus === tg.podIdx);
      tg.el.style.opacity = on ? 1 : 0;
      if (!on) continue;
      tg.worker.getWorldPosition(wp); wp.y += tg.big ? 2.0 : 1.45;
      const [x, y] = toScreen(wp); tg.el.style.left = x + 'px'; tg.el.style.top = y + 'px';
    }
    gem.rotation.y += dt * 0.5; wire.rotation.y -= dt * 0.3; wire.rotation.x += dt * 0.12;
    ring1.rotation.x = Math.PI / 2 + Math.sin(t * 0.6) * 0.3; ring2.rotation.y = t * 0.4; ring2.rotation.x = Math.PI / 2.6;
    core.position.y = CORE.y + Math.sin(t * 0.9) * 0.15;
    beam.material.opacity = 0.14 + Math.sin(t * 2) * 0.05;
    lift.copy(core.position); lift.y += 3.1;
    { const [x, y] = toScreen(lift); engineLabel.style.left = x + 'px'; engineLabel.style.top = y + 'px'; }
    engineLabel.style.opacity = focus >= 0 ? 0.15 : 1;
    for (let i = pulses.length - 1; i >= 0; i--) {
      const q = pulses[i]; q.t += dt / 2.2;
      if (q.t >= 1) { scene.remove(q.m); q.m.material.dispose(); pulses.splice(i, 1); gem.material.emissiveIntensity = 1.2; continue; }
      q.m.position.copy(q.p.curve.getPoint(q.t));
    }
    gem.material.emissiveIntensity += (0.55 - gem.material.emissiveIntensity) * (1 - Math.pow(0.05, dt));
    sinceEvent += dt; if (sinceEvent > 2.6) { sinceEvent = 0; nextEvent(); }
    sinceBadge += dt;
    if (sinceBadge > 1) { sinceBadge = 0; const now = performance.now(); if (pods.some(p => p.hasBadge && p.badgeUntil && p.badgeUntil < now)) { pods.forEach(p => { if (p.badgeUntil < now) p.badgeUntil = 0; }); renderCards(); } }
    renderer.render(scene, cam);
    requestAnimationFrame(tick);
  }
  const tickClock = () => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: D.tz || 'UTC' }) + ' ' + (D.tzLabel || ''); };
  tickClock(); setInterval(tickClock, 15000);
  for (let k = 0; k < 4; k++) nextEvent();
  setInterval(() => {
    if (focus >= 0 || compact || fitCheck > 0) return;
    const rs = pods.filter(p => !p.card.hidden).map(p => p.card.getBoundingClientRect());
    const hit = (A, B) => A.left < B.right && B.left < A.right && A.top < B.bottom && B.top < A.bottom;
    if (rs.some((A, a) => rs.some((B, b) => b > a && hit(A, B)))) setCompact(true);
  }, 1000);
  setInterval(() => { if (fitCheck > 0) fitCheck = Math.max(0, fitCheck - 60); }, 1000);
  tick();
})();
</script>
</body>
</html>
